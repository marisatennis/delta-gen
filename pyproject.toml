[build-system]
requires = ["Hatchling"]
build-backend = "hatchling.build"

[project]
name = "deltagen"
version = "0.0.1"
authors = [
  { name="Maria Barragan Rovira", email="43114443+marisatennis@users.noreply.github.com" },
]
description = "Data Lake House Generator"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["data engineering", "lakehouse", "warehouse", "kimball"]
[project.urls]
Homepage = "https://github.com/marisatennis/delta-gen"
Template = "https://github.com/marisatennis/delta-gen-template"

[tool.poetry.dependencies]
python = "3.10"