# Example: Replace by Partition with Period Expansion
# Demonstrates the replace_by_partition load mode combined with
# watermark-based incremental loading and source_period_column
# for safe partition replacement.

name: monthly_snapshot
layer: silver
target_schema: silver
description: "Monthly data snapshot with partition-based replacement"

policies:
  orchestration:
    active: true
    batch: 3
    order: 10
  optimisation:
    load_mode: replace_by_partition
    # No merge_strategy needed - replace_by_partition deletes then inserts

natural_key:
  - entity_id
  - report_month

sources:
  - name: src
    table: bronze.monthly_data
  - name: ref
    table: silver.reference_data
    incremental: false  # Always load all reference data (skip watermark filter)
    broadcast: true

incremental:
  filter_mode: watermark
  watermark_column: modified_date
  source_watermark_column: last_modified
  # source_period_column enables period expansion:
  # 1. Watermark identifies which periods have modifications
  # 2. Then loads ALL rows for those periods (not just modified rows)
  # 3. Prevents partition_replace from losing unchanged rows
  source_period_column: report_month

stages:
  - name: enrich
    mode: transformation
    joins:
      - name: ref_lookup
        source: ref
        type: left
        conditions:
          - left: entity_type
            right: type_code

columns:
  - name: entity_id
    data_type: string
    nullable: false
    inputs:
      - source: src
        column: id

  - name: report_month
    data_type: int
    nullable: false
    inputs:
      - source: src
        column: period

  - name: entity_type
    data_type: string
    nullable: true
    inputs:
      - source: src
        column: type

  - name: entity_type_label
    data_type: string
    nullable: true
    inputs:
      - source: ref
        column: type_label

  - name: value
    data_type: decimal
    nullable: false
    default: 0.0
    inputs:
      - source: src
        column: amount

  - name: modified_date
    data_type: date
    nullable: false
    inputs:
      - source: src
        column: last_modified
